services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cybercare
      POSTGRES_USER: cybercare
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD no ambiente}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - cybercare_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cybercare -d cybercare"]
      interval: 5s
      retries: 10
volumes:
  cybercare_db:
